services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: paves-builder:0.4.0
    platform: linux/amd64
    init: true
    # The image supports arbitrary runtime UIDs; match the owner of the bind mount.
    user: "${PAVES_UID:-1000}:${PAVES_GID:-1000}"
    working_dir: /workspace
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - type: bind
        source: .
        target: /workspace
    environment:
      PAVES_JUPYTER_TOKEN: "${PAVES_JUPYTER_TOKEN:-}"
      OPENMM_CPU_THREADS: "${PAVES_CPU_THREADS:-2}"
      OPENBLAS_NUM_THREADS: "${PAVES_CPU_THREADS:-2}"
      OMP_NUM_THREADS: "${PAVES_CPU_THREADS:-2}"
    shm_size: 1gb
    restart: unless-stopped
